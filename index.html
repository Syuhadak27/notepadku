<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f3f4f8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Catatan — aplikasi menulis pribadi yang cepat, tenang, dan sepenuhnya offline. Catatan, checklist, gambar, rekaman, dan folder tersimpan di perangkatmu." />
  <meta name="application-name" content="Catatan" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Catatan" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Catatan</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />

  <script>
    /* Terapkan preferensi tampilan sebelum CSS dilukis agar tidak berkedip. */
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('catatan:prefs') || '{}') || {};
        var pref = ['light', 'dark', 'system'].indexOf(prefs.theme) >= 0 ? prefs.theme : 'system';
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePref = pref;
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e1015' : '#f3f4f8');
        if (typeof prefs.accent === 'string' && /^#[0-9a-f]{6}$/i.test(prefs.accent)) {
          document.documentElement.style.setProperty('--accent', prefs.accent);
        }
        var size = Math.min(24, Math.max(14, Number(prefs.fontSize) || 17));
        document.documentElement.style.setProperty('--editor-font-size', size + 'px');
      } catch (err) { /* preferensi opsional */ }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-screen" id="boot-screen">
      <div class="boot-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="100%" height="100%">
          <defs>
            <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5b8cff" />
              <stop offset="1" stop-color="#6d5dfc" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="17" fill="url(#bootGrad)" />
          <rect x="15" y="12" width="34" height="40" rx="6" fill="#fff" opacity=".97" />
          <path d="M23 23h18M23 31h18M23 39h11" stroke="#c9d6ff" stroke-width="3.2" stroke-linecap="round" />
          <circle cx="42" cy="45" r="8" fill="#6d5dfc" />
          <path d="m38.5 45 2.4 2.4 4.4-5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="boot-title">Catatan</div>
      <div class="boot-bar"><span></span></div>
      <div class="boot-sub" id="boot-sub">Menyiapkan catatanmu…</div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="pwa-root"></div>
  <div id="print-root"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif;line-height:1.6">
      <strong>Catatan memerlukan JavaScript.</strong><br />
      Aktifkan JavaScript di browser untuk membuka catatanmu.
    </div>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
